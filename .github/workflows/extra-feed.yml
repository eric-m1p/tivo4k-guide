name: Refresh /extra feed

# StreamCorner publishes event sources close to game time, so this re-sweeps the
# event list every 30 min and re-resolves only the events that are live or about
# to start and still have no working manifest.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: extra-feed
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium

      - name: Refresh feed
        run: |
          python3 extra_refresh.py --max 300 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit feed if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add extra_events.json extra_streams.json extra.m3u
          if git diff --cached --quiet; then
            echo "extra feed unchanged."
          else
            git commit -m "Update /extra feed $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
