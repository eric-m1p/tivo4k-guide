name: Refresh Live Events Feed

# Pulls live, upcoming, and 24/7 embed streams directly from upstream APIs into
# events.json so the Stream Sites TV app fetches from GitHub without a local server.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Distill events feed
        run: python3 distill_events.py --json events.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit events.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json
          if git diff --cached --quiet; then
            echo "events.json unchanged."
          else
            git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
