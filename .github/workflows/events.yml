name: Refresh Live Events Feed

# Pulls live, upcoming, and 24/7 embed streams from both upstream catalogues
# into events.json, so the Stream Sites TV app fetches one GitHub file:
#   - api.ppv.st (primary live-event API)
#   - every StreamCorner provider through the site's own provider-data worker
#     (NFL, NBA, UEFA Nations League, ALPHA, BETA, CHARLIE, #001, /extra,
#      24/7 admin/channel lists)
#   - the extra sportsurge-family sites (isportsurge, buffstreams,
#     totalsporteki, roxiestreams) for additional mirrors per fixture
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write # site canary opens/closes "Site down" issues

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/events.yml') }}

      - name: Install Playwright + Chromium
        run: |
          pip install -q requests playwright jsonschema
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium
          fi
          python -m playwright install-deps chromium

      - name: Feed v2 + source health rules (unit tests)
        run: python3 -m unittest test_feed_v2 test_source_health_v2 test_channel_health

      - name: Fetch device telemetry branch (optional)
        run: git fetch origin telemetry:refs/remotes/origin/telemetry || true

      # Probe budget, live window, 24/7 cadence, playback checks and canary
      # thresholds all come from feed_policy.json (policy.probe / policy.canary).
      - name: Distill events feed (PPV + all StreamCorner providers)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 distill_events.py --streamcorner \
            --sites isportsurge,buffstreams,totalsporteki,roxiestreams \
            --probe-sources --probe-workers 64 --quality-workers 4 \
            --json events.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # Live TV: a small rotating sample of live_channels.json stream URLs
      # (policy.probe.channels); failing URLs sort after their channel's healthy ones.
      - name: Channel health (sparse)
        run: python3 channel_health.py | tee -a "$GITHUB_STEP_SUMMARY" || echo "channel health skipped"

      # Backup HLS streams for the TV app's Sling channels, matched by name.
      - name: Channel backups for the TV app
        run: python3 channel_alts.py | tee -a "$GITHUB_STEP_SUMMARY" || echo "channel backups skipped"

      - name: Commit events.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          python3 feed_v2.py validate events.json
          git add events.json source_health.json source_blocklist.json live_channels.json channel_alts.json
          if git diff --cached --quiet; then
            echo "events.json/source_health.json/source_blocklist.json unchanged."
          else
            git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
