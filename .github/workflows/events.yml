name: Refresh Live Events Feed

# Pulls live, upcoming, and 24/7 embed streams from both upstream catalogues
# into events.json, so the Stream Sites TV app fetches one GitHub file:
#   - api.ppv.st (primary live-event API)
#   - every StreamCorner provider through the site's own provider-data worker
#     (NFL, NBA, UEFA Nations League, ALPHA, BETA, CHARLIE, #001, /extra,
#      24/7 admin/channel lists)
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: guide
  cancel-in-progress: false

jobs:
  distill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('.github/workflows/events.yml') }}

      - name: Install Playwright + Chromium
        run: |
          pip install -q requests playwright
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install chromium
          fi
          python -m playwright install-deps chromium

      - name: Fetch device telemetry branch (optional)
        run: git fetch origin telemetry:refs/remotes/origin/telemetry || true

      - name: Distill events feed (PPV + all StreamCorner providers)
        run: |
          python3 distill_events.py --streamcorner --probe-sources --probe-all \
            --probe-workers 64 --probe-budget 6000 \
            --quality-budget 120 --quality-workers 4 --quality-timeout 10 \
            --max-sources 8 --json events.json \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit events.json if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add events.json source_health.json source_blocklist.json
          if git diff --cached --quiet; then
            echo "events.json/source_health.json/source_blocklist.json unchanged."
          else
            git commit -m "Update events $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase origin main
            git push
          fi
